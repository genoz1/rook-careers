<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/rook-icon-180.png">
<link rel="icon" href="assets/rook-icon-192.png" type="image/png" sizes="192x192">
<meta name="theme-color" content="#071E41">
<title>Saved Jobs — ROOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#071E41; --royal:#1463FF; --teal:#12B8A6; --gray:#F5F7FA;
    --muted:#5B6B85; --border:#E3E8F0; --radius:14px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); color:var(--navy); background:var(--gray); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display); letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; border:none;}
  .btn-primary{background:var(--royal); color:#fff;}
  .btn-outline{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}

  .topbar{background:var(--navy); padding:16px 0;}
  .topbar-inner{max-width:1200px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between;}
  .logo{display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:700; font-size:19px; color:#fff;}
  .logo svg{width:22px; height:22px;}
  .top-nav{display:flex; gap:26px; font-size:13.5px; font-weight:500; color:#fff;}
  .top-nav a{opacity:.75;}
  .top-nav a.active{opacity:1; font-weight:700;}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--royal),var(--teal)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;}

  .container{max-width:1200px; margin:0 auto; padding:32px 24px 80px;}
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
  .page-head h1{font-size:24px; font-weight:700;}
  .page-head p{font-size:14px; color:var(--muted); margin-top:4px;}

  .compare-bar{
    display:flex; background:var(--navy); border-radius:12px; padding:14px 20px; margin-bottom:20px;
    align-items:center; justify-content:space-between; color:#fff; font-size:13.5px; flex-wrap:wrap; gap:10px;
  }
  .compare-bar b{color:var(--teal);}

  .job-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .job-card{
    background:#fff; border-radius:var(--radius); padding:22px; box-shadow:0 2px 10px -4px rgba(11,29,58,0.08); position:relative;
  }
  .job-card .compare-check-label{
    position:absolute; top:16px; right:16px; display:flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; color:#5B6B85; cursor:pointer;
  }
  .job-card .compare-check{width:16px; height:16px; cursor:pointer; margin:0;}
  .match-pill{font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(0,194,168,0.12); color:#00806E; display:inline-block; margin-bottom:12px;}

  .compare-modal-overlay{
    position:fixed; inset:0; background:rgba(11,29,58,0.5); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .compare-modal{
    background:#fff; border-radius:var(--radius); max-width:1000px; width:100%; max-height:85vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .compare-modal-head{
    display:flex; align-items:center; justify-content:space-between; padding:20px 24px;
    border-bottom:1px solid var(--border);
  }
  .compare-modal-head h3{margin:0;}
  .compare-modal-body{padding:24px; overflow-y:auto; overflow-x:auto;}
  .compare-table{width:100%; min-width:480px; border-collapse:collapse; font-size:13.5px;}
  .compare-table th, .compare-table td{text-align:left; padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:top;}
  .compare-table th{font-weight:600; color:#5B6B85; white-space:nowrap; width:140px;}
  .compare-table td a{color:var(--royal, #1463FF); font-weight:600;}
  .job-card h4{font-size:16px; font-weight:700; margin-bottom:4px; padding-right:24px;}
  .job-card .company{font-size:13px; color:var(--muted); margin-bottom:12px;}
  .job-meta{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:16px;}
  .job-actions{display:flex; gap:8px;}
  .saved-date{font-size:11.5px; color:#8B96AB; margin-top:12px;}

  .empty-hint{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}
  .main-scroll{padding:20px 0;}

  .shell{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
  .sidebar{background:var(--navy); color:#fff; padding:26px 20px; display:flex; flex-direction:column;}
  .side-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .side-nav a{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:9px; font-size:14px; font-weight:500; color:#AEB9CF;}
  .side-nav a svg{width:17px; height:17px;}
  .side-nav a.active{background:rgba(255,255,255,0.08); color:#fff;}
  .side-nav a:hover{color:#fff;}
  .side-foot{border-top:1px solid rgba(255,255,255,0.1); padding-top:16px; display:flex; align-items:center; gap:10px;}
  .side-foot .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--royal),var(--teal)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; flex-shrink:0;}
  .side-foot .n{font-size:13.5px; font-weight:600;}
  .side-foot .r{font-size:11.5px; color:#8B96AB;}

  .mobile-app-bar{display:none;}
  .mobile-close-btn{display:none;}
  @media(max-width:900px){
    .mobile-app-bar{
      display:flex; align-items:center; justify-content:space-between;
      background:var(--navy); padding:14px 18px; position:sticky; top:0; z-index:150;
    }
    .mobile-app-bar .logo{margin-bottom:0;}
    .mobile-app-bar .logo img{height:30px;}
    .mobile-app-bar .logo span{font-size:22px !important;}
    .mobile-menu-btn{background:none; border:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
    .mobile-menu-btn svg{width:22px; height:22px; color:#fff;}
    .sidebar{display:none;}
    .shell{grid-template-columns:1fr;}
    .sidebar.mobile-open{
      display:flex; position:fixed; inset:0; z-index:200; width:100%;
      overflow-y:auto; padding-top:20px;
    }
    .mobile-close-btn{display:none;}
    .sidebar.mobile-open .mobile-close-btn{
      display:block; position:absolute; top:18px; right:18px;
      background:none; border:none; color:#fff; cursor:pointer;
    }
  }


  @media(max-width:900px){
    .job-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="mobile-app-bar">
  <div class="logo" style="gap:8px;">
    <img src="assets/rook-icon-192.png" alt="ROOK"><span style="font-family:var(--font-display); font-weight:700; letter-spacing:-0.02em; color:#EDF3FF; line-height:1;">ROOK</span>
  </div>
  <button type="button" class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open')" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</div>

<div class="shell">
  <aside class="sidebar">
    <button type="button" onclick="document.querySelector('.sidebar').classList.remove('mobile-open')" aria-label="Close menu" class="mobile-close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="logo" style="gap:8px;">
      <img src="assets/rook-icon-192.png" alt="ROOK" style="height:43px; width:auto; display:block;"><span style="font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-0.02em; color:#EDF3FF; line-height:1;">ROOK</span>
    </div>
    <nav class="side-nav">
      <a href="rook-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Dashboard</a>
      <a href="rook-search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Job Search</a>
      <a href="rook-recruiter-jobs.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Recruiter Jobs</a>
      <a href="rook-tracker.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Applications</a>
      <a href="rook-saved.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>Saved Jobs</a>
      <a href="rook-intelligence.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>Career Intelligence</a>
      <a href="rook-onboarding.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>My Résumés</a>
      <a href="rook-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="avatar"></div>
      <div><div class="n">—</div><div class="r">—</div></div>
    </div>
    <a href="#" onclick="rookSignOut(); return false;" style="display:block; text-align:center; font-size:12.5px; font-weight:600; color:#8B96AB; padding:12px 0 4px;">Log Out</a>
  </aside>

  <div class="main-scroll">
    <div style="max-width:1200px; margin:0 auto; padding:0 24px 12px;"></div>


<div class="container">
  <div class="page-head">
    <div>
      <h1>Saved Jobs</h1>
      <p>Roles you've bookmarked to review or compare later.</p>
    </div>
    <a href="rook-search.html" class="btn btn-outline">Find More Jobs</a>
  </div>

  <div class="compare-bar show" id="compareBar">
    <span id="compareBarText">Check 2 or more jobs below to compare them side by side.</span>
  </div>

  <div id="compareModalOverlay" class="compare-modal-overlay" style="display:none;" onclick="if(event.target===this) closeCompareModal();">
    <div class="compare-modal">
      <div class="compare-modal-head">
        <h3>Compare Jobs</h3>
        <button type="button" class="btn-icon" onclick="closeCompareModal()" aria-label="Close">✕</button>
      </div>
      <div id="compareModalBody" class="compare-modal-body"></div>
    </div>
  </div>

  <div class="job-grid" id="jobGrid">
    <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#5B6B85; font-size:14px;">Loading your saved jobs…</div>
  </div>
</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rook-config.js"></script>
<script src="rook-auth.js"></script>
<script>
// Reported directly: the compare bar was invisible until 2+ jobs were
// already checked, and the checkbox itself only had a hover tooltip
// (useless on mobile) - nothing told a candidate this feature existed
// at all until they'd already stumbled into checking two boxes. The
// bar is now always visible with a message that changes as you go,
// so it teaches the feature rather than hiding it.
function updateCompare(){
  const checked = document.querySelectorAll('.compare-check:checked').length;
  const text = document.getElementById('compareBarText');
  if (checked >= 2) {
    text.innerHTML = `<b>${checked}</b> selected for comparison &nbsp; <a href="#" class="btn btn-primary btn-sm" onclick="openCompareModal(); return false;" style="margin-left:8px;">Compare Jobs</a>`;
  } else if (checked === 1) {
    text.textContent = '1 selected — check at least 1 more to compare.';
  } else {
    text.textContent = 'Check 2 or more jobs below to compare them side by side.';
  }
}

// Reported directly: the selection mechanism (checkboxes, live count,
// bar show/hide) existed, but clicking "Compare Jobs" itself did
// nothing - no comparison view was ever built. This builds a real
// side-by-side table from whichever 2+ jobs are currently checked.
function openCompareModal() {
  const checkedIds = Array.from(document.querySelectorAll('.compare-check:checked')).map((el) => el.dataset.jobId);
  const jobs = allSavedJobs.filter((j) => checkedIds.includes(String(j.id)));
  if (jobs.length < 2) return;

  const rows = [
    ['Title', (j) => escapeHtml(j.title_original || j.title_normalized || 'Untitled role')],
    ['Company', (j) => escapeHtml(j.company_name || (j.source_type === 'recruiter_posted' ? 'Confidential search' : '—'))],
    ['Location', (j) => escapeHtml(j.location_raw || '—')],
    ['Match Score', (j) => j.match?.overall_score != null ? `${j.match.overall_score}%` : '—'],
    ['Compensation', (j) => escapeHtml(j.compensation_text || (j.salary_min ? `$${j.salary_min}${j.salary_max ? '–$' + j.salary_max : '+'}` : '—'))],
    ['Distance', (j) => j.distance_miles != null ? `${j.distance_miles} mi` : '—'],
    ['Posted', (j) => escapeHtml(j.date_posted || j.first_seen_at || '—')],
    ['Link', (j) => j.source_type === 'recruiter_posted'
      ? `<a href="rook-apply.html?job=${escapeHtml(j.id)}">Apply</a>`
      : (j.source_url ? `<a href="${escapeHtml(j.source_url)}" target="_blank">View Original</a>` : '—')],
  ];

  const html = `
    <table class="compare-table">
      <thead><tr><th></th>${jobs.map((j) => `<th>${escapeHtml(j.company_name || 'Job')}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(([label, getValue]) => `
          <tr><th>${label}</th>${jobs.map((j) => `<td>${getValue(j)}</td>`).join('')}</tr>
        `).join('')}
      </tbody>
    </table>`;

  document.getElementById('compareModalBody').innerHTML = html;
  document.getElementById('compareModalOverlay').style.display = 'flex';
}

function closeCompareModal() {
  document.getElementById('compareModalOverlay').style.display = 'none';
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let allSavedJobs = [];

(async () => {
  const token = await rookRequireAuth();
  if (!token) return;
  rookPopulateSidebar();

  const grid = document.getElementById('jobGrid');

  try {
    const res = await rookApiFetch('/saved-jobs');
    if (!res.ok) throw new Error('API returned ' + res.status);
    const jobs = await res.json();

    if (!Array.isArray(jobs) || jobs.length === 0) {
      grid.innerHTML = '<div class="empty-hint">Nothing saved yet — jobs you save from the Dashboard or Job Search will show up here.</div>';
      return;
    }

    allSavedJobs = jobs;
    grid.innerHTML = jobs.map(renderSavedCard).join('');
  } catch (err) {
    grid.innerHTML = `<div class="empty-hint">Could not load saved jobs (${escapeHtml(err.message)}). Showing example cards below — see ROOK-Setup-Guide.pdf.</div>`;
  }
})();

function renderSavedCard(job) {
  const score = job.match?.overall_score;
  const comp = job.compensation_text || (job.salary_min ? `$${job.salary_min}${job.salary_max ? '–$' + job.salary_max : '+'}` : '');
  // Recruiter-posted jobs have no source_url — same dead-link issue
  // found and fixed on the Dashboard/Job Analysis pages earlier, missed
  // here since this is a separate page. Routes to the in-site Apply
  // flow for those instead of a dead "#" link.
  const isRecruiterPosted = job.source_type === 'recruiter_posted';
  const primaryBtn = isRecruiterPosted
    ? `<a href="rook-apply.html?job=${escapeHtml(job.id)}" class="btn btn-primary btn-sm">Apply Now</a>`
    : `<a href="${job.source_url || '#'}" target="_blank" class="btn btn-primary btn-sm">View Original</a>`;
  return `
    <div class="job-card" data-job-id="${escapeHtml(job.id)}">
      <label class="compare-check-label">
        <input type="checkbox" class="compare-check" data-job-id="${escapeHtml(job.id)}" onchange="updateCompare()" />
        <span>Compare</span>
      </label>
      ${score != null ? `<span class="match-pill">${score}% Match</span>` : ''}
      <h4>${escapeHtml(job.title_original || job.title_normalized || 'Untitled role')}</h4>
      <div class="company">${escapeHtml(job.company_name || (isRecruiterPosted ? 'Confidential search' : ''))} — ${escapeHtml(job.location_raw || '')}</div>
      <div class="job-meta">
        ${comp ? `<span>${escapeHtml(comp)}</span>` : ''}
      </div>
      <div class="job-actions">
        ${primaryBtn}
        <button type="button" class="btn btn-outline btn-sm" onclick="removeSaved('${escapeHtml(job.id)}', this)">Remove</button>
      </div>
    </div>`;
}

async function removeSaved(jobId, btn) {
  const card = btn.closest('.job-card');
  btn.disabled = true;
  try {
    const res = await rookApiFetch(`/jobs/${jobId}/save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ saved: false }),
    });
    if (res.ok && card) card.remove();
  } catch (err) {
    console.error('Remove failed:', err);
    btn.disabled = false;
  }
}
</script>

</body>
</html>
