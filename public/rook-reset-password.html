<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/rook-icon-180.png">
<meta name="theme-color" content="#071E41">
<title>Reset Password — ROOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#071E41; --royal:#1463FF; --teal:#12B8A6; --gray:#F5F7FA;
    --muted:#5B6B85; --border:#E3E8F0;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body); color:var(--navy); background:var(--gray);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
  }
  h1,h2{font-family:var(--font-display); letter-spacing:-0.01em;}
  a{color:var(--royal); text-decoration:none;}
  .logo{display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:700; font-size:22px; margin-bottom:32px;}
  .card{background:#fff; border-radius:16px; padding:36px; width:100%; max-width:400px; box-shadow:0 20px 45px -18px rgba(11,29,58,0.2);}
  h2{font-size:20px; margin-bottom:6px;}
  .sub{font-size:13.5px; color:var(--muted); margin-bottom:22px;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .field input{padding:11px 13px; border-radius:9px; border:1px solid var(--border); font-size:14px; font-family:var(--font-body);}
  .btn{width:100%; padding:12px; border-radius:999px; border:none; background:var(--royal); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; margin-top:6px;}
  .btn:disabled{background:#B9C6DE; cursor:not-allowed;}
  .msg{font-size:13px; margin-top:14px; text-align:center; line-height:1.5;}
  .msg.error{color:#C23B3B;}
  .msg.success{color:#00806E;}
</style>
</head>
<body>

<div class="logo">
  <img src="assets/rook-icon-192.png" alt="ROOK" style="height:46px; width:auto; display:block;">
  <span style="font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-0.02em; color:var(--navy); line-height:1;">ROOK</span>
</div>

<div class="card">
  <div id="panelForm">
    <h2>Set a new password</h2>
    <div class="sub">Choose a new password for your ROOK account.</div>
    <div class="field"><label>New Password</label><input type="password" id="newPassword" autocomplete="new-password"></div>
    <div class="field"><label>Confirm Password</label><input type="password" id="confirmPassword" autocomplete="new-password"></div>
    <button class="btn" id="resetBtn" onclick="handleReset()" disabled>Update Password</button>
  </div>
  <div class="msg" id="resetMsg">Verifying your reset link...</div>
</div>

<script src="rook-config.js"></script>
<script>
  const configured = window.ROOK_CONFIG.SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL";
  const client = configured
    ? window.supabase.createClient(window.ROOK_CONFIG.SUPABASE_URL, window.ROOK_CONFIG.SUPABASE_ANON_KEY)
    : null;

  function setMsg(text, type) {
    const el = document.getElementById('resetMsg');
    el.textContent = text;
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  if (!configured) {
    setMsg('Supabase isn\'t configured yet — see ROOK-Setup-Guide.pdf.', 'error');
  } else {
    // Supabase's JS client automatically reads the recovery tokens out of
    // the URL (the emailed link redirects here with them in the hash) and
    // fires a PASSWORD_RECOVERY event once that session is established —
    // this is the documented pattern for a password-reset landing page.
    // Until that event fires, the form stays disabled: submitting a new
    // password before the recovery session exists would just fail.
    let recoveryReady = false;

    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoveryReady = true;
        document.getElementById('resetBtn').disabled = false;
        setMsg('');
      }
    });

    // If the link is malformed, expired, or already used, no
    // PASSWORD_RECOVERY event ever fires — this timeout gives the user a
    // clear explanation instead of a form that silently never works.
    setTimeout(() => {
      if (!recoveryReady) {
        setMsg('This reset link is invalid or has expired. Request a new one from the login page.', 'error');
      }
    }, 4000);
  }

  async function handleReset() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword.length < 8) return setMsg('Password must be at least 8 characters.', 'error');
    if (newPassword !== confirmPassword) return setMsg('Passwords don\'t match.', 'error');

    document.getElementById('resetBtn').disabled = true;
    setMsg('Updating your password...');

    const { error } = await client.auth.updateUser({ password: newPassword });

    if (error) {
      document.getElementById('resetBtn').disabled = false;
      return setMsg(error.message, 'error');
    }

    setMsg('Password updated. Redirecting...', 'success');
    document.getElementById('panelForm').style.display = 'none';
    setTimeout(() => { window.location.href = 'rook-dashboard.html'; }, 1500);
  }
</script>

</body>
</html>
