<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<meta name="theme-color" content="#071E41">
<title>Recruiter Dashboard — ROOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#071E41; --royal:#1463FF; --teal:#12B8A6; --gray:#F5F7FA; --recruiter:#7C3AED;
    --muted:#5B6B85; --border:#E3E8F0; --radius:14px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); color:var(--navy); background:var(--gray); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display); letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 22px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; border:none;}
  .btn-primary{background:var(--recruiter); color:#fff;}
  .btn-outline{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-sm{padding:8px 16px; font-size:12.5px;}

  .topbar{background:var(--navy); padding:16px 0;}
  .topbar-inner{max-width:900px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:var(--font-display); font-weight:700; font-size:18px; color:#fff; display:flex; align-items:center; gap:8px;}

  .container{max-width:900px; margin:0 auto; padding:32px 24px 60px;}
  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:28px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .field input{padding:11px 13px; border-radius:9px; border:1px solid var(--border); font-size:14px; font-family:var(--font-body);}

  .posting-row{display:flex; align-items:center; gap:16px; padding:20px 24px; border-bottom:1px solid var(--border); transition:background 0.15s ease;}
  .posting-row:hover{background:var(--gray);}
  .posting-row:last-child{border-bottom:none;}
  .posting-main{flex:1; min-width:0;}
  .posting-title{font-size:15px; font-weight:700;}
  .posting-meta{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .status-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px; text-transform:uppercase; letter-spacing:0.02em;}
  .status-pending{background:rgba(185,137,0,0.1); color:#B98900;}
  .status-approved{background:rgba(0,128,110,0.1); color:#00806E;}
  .status-rejected{background:rgba(194,59,59,0.1); color:#C23B3B;}
  .status-closed{background:rgba(139,150,171,0.15); color:#5B6B85;}

  .msg{font-size:13px; margin-top:14px; line-height:1.5;}
  .msg.error{color:#C23B3B;}
  .msg.success{color:#00806E;}
  #loading, #empty{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <img src="assets/rook-icon-192.png" alt="ROOK" style="height:24px; width:auto; display:block;">
      ROOK Recruiter
    </a>
    <div style="display:flex; align-items:center; gap:18px;">
      <a href="rook-recruiter-settings.html" style="font-size:12.5px; font-weight:600; color:#AEB9CF;">Account Settings</a>
      <a href="#" onclick="rookSignOut('rook-recruiter-login.html'); return false;" style="font-size:12.5px; font-weight:600; color:#AEB9CF;">Log Out</a>
    </div>
  </div>
</div>

<div class="container">
  <div id="loading">Loading…</div>

  <!-- Shown only if this recruiter hasn't completed their profile yet -->
  <div class="card" id="profileForm" style="display:none;">
    <h2 style="font-size:20px; margin-bottom:6px;">Complete your recruiter profile</h2>
    <p style="color:var(--muted); font-size:13.5px; margin-bottom:20px;">This only takes a moment — we'll use this to pre-fill every job you post.</p>
    <div class="field-row">
      <div class="field"><label>Your Name</label><input type="text" id="fieldName"></div>
      <div class="field"><label>Email</label><input type="email" id="fieldEmail"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Agency / Company</label><input type="text" id="fieldCompany"></div>
      <div class="field"><label>Phone</label><input type="text" id="fieldPhone"></div>
    </div>
    <a href="#" class="btn btn-primary" onclick="saveProfile(); return false;">Save & Continue</a>
    <div class="msg" id="profileMsg"></div>
  </div>

  <!-- Shown once a profile exists -->
  <div id="postingsView" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div>
        <h1 style="font-size:24px;">Your Postings</h1>
        <p style="color:var(--muted); font-size:13.5px; margin-top:4px;">Welcome back, <span id="welcomeName"></span>.</p>
      </div>
      <a href="rook-recruiter-post.html" class="btn btn-primary">+ Post New Job</a>
    </div>
    <div id="postingsEmpty" style="display:none;" class="card"><div id="empty">You haven't posted any jobs yet.</div></div>
    <div class="card" id="postingsList" style="padding:0; display:none;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rook-config.js"></script>
<script src="rook-auth.js"></script>
<script>
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(async () => {
  const token = await rookRequireAuth('rook-recruiter-login.html');
  if (!token) return;

  try {
    const res = await rookApiFetch('/recruiter-profile');
    const profile = await res.json();
    document.getElementById('loading').style.display = 'none';

    if (!profile) {
      // Pre-fill email from the auth session so they don't retype it.
      const { data: sessionData } = await rookSupabase.auth.getSession();
      document.getElementById('fieldEmail').value = sessionData?.session?.user?.email || '';
      document.getElementById('profileForm').style.display = 'block';
      return;
    }

    document.getElementById('welcomeName').textContent = profile.name || profile.email;
    document.getElementById('postingsView').style.display = 'block';
    loadPostings();
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load your account: ' + err.message;
  }
})();

async function saveProfile() {
  const msg = document.getElementById('profileMsg');
  const payload = {
    name: document.getElementById('fieldName').value.trim(),
    email: document.getElementById('fieldEmail').value.trim(),
    company_name: document.getElementById('fieldCompany').value.trim(),
    phone: document.getElementById('fieldPhone').value.trim(),
  };
  if (!payload.name || !payload.email) {
    msg.className = 'msg error';
    msg.textContent = 'Name and email are required.';
    return;
  }

  try {
    const res = await rookApiFetch('/recruiter-profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('Could not save your profile.');
    window.location.reload();
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = err.message;
  }
}

async function loadPostings() {
  try {
    const res = await rookApiFetch('/my-recruiter-postings');
    const postings = await res.json();
    if (!res.ok) throw new Error(postings.error || 'Could not load postings');

    if (!Array.isArray(postings) || postings.length === 0) {
      document.getElementById('postingsEmpty').style.display = 'block';
      return;
    }

    document.getElementById('postingsList').style.display = 'block';
    document.getElementById('postingsList').innerHTML = postings.map(renderPosting).join('');
  } catch (err) {
    document.getElementById('postingsEmpty').style.display = 'block';
    document.getElementById('empty').textContent = 'Could not load postings: ' + err.message;
  }
}

function renderPosting(job) {
  // Real bug this fixes: the badge only ever reflected moderation_status
  // (pending/approved/rejected), never whether the recruiter had
  // actually closed the posting — so a closed job could still show
  // "APPROVED", which is misleading about whether it's actually live.
  // Also makes the whole row clickable through to the edit page —
  // previously there was no way to view, edit, or close a posting at
  // all once submitted.
  const label = job.status === 'closed' ? 'closed' : (job.moderation_status || 'pending');
  const statusClass = { pending: 'status-pending', approved: 'status-approved', rejected: 'status-rejected' }[label] || 'status-closed';
  return `
    <a href="rook-recruiter-edit-job.html?id=${encodeURIComponent(job.id)}" class="posting-row" style="cursor:pointer;">
      <div class="posting-main">
        <div class="posting-title">${escapeHtml(job.title_original)}</div>
        <div class="posting-meta">${escapeHtml(job.location_raw || 'No location given')}${job.compensation_text ? ' · ' + escapeHtml(job.compensation_text) : ''}</div>
      </div>
      <span class="status-badge ${statusClass}">${escapeHtml(label)}</span>
    </a>`;
}
</script>

</body>
</html>
